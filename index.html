<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Let's Run!</title>
    <!-- Tailwind CSS for UI overlay styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Press Start 2P for Arcade visual style -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arcade-font {
            font-family: 'Press Start 2P', monospace;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        /* Custom Glowing Glow Effects */
        .neon-box-cyan {
            box-shadow: 0 0 15px #00f0ff, inset 0 0 10px #00f0ff;
        }
        .neon-box-pink {
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px #ff007f;
        }
    </style>
</head>
<body class="bg-gray-950 flex justify-center items-center h-screen overflow-hidden">

    <!-- Container sizing optimized for Portrait Phone displays -->
    <div id="game-container" class="relative w-full h-full max-w-md max-h-screen overflow-hidden bg-slate-900 border-x-0 md:border-x-2 border-cyan-500/30 flex flex-col justify-between">
        
        <!-- Game Canvas Layer -->
        <canvas id="gameCanvas" class="w-full h-full absolute inset-0"></canvas>

        <!-- HUD Layer (Top) -->
        <div id="hud" class="relative z-10 flex justify-between items-center p-4 pointer-events-none">
            <div class="flex flex-col">
                <span class="text-xs text-cyan-400 font-bold uppercase tracking-wider">Score</span>
                <span id="score-display" class="arcade-font text-xl text-cyan-300 drop-shadow-[0_0_8px_rgba(0,240,255,0.8)]">0</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-xs text-pink-400 font-bold uppercase tracking-wider">High Score</span>
                <span id="highscore-display" class="arcade-font text-xl text-pink-400 drop-shadow-[0_0_8px_rgba(255,0,127,0.8)]">0</span>
            </div>
        </div>

        <!-- Start Screen Overlay -->
        <div id="start-overlay" class="absolute inset-0 z-20 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
            <div class="w-16 h-16 mb-4 rounded-2xl bg-gradient-to-tr from-cyan-500 to-pink-500 flex items-center justify-center shadow-lg shadow-cyan-500/50 animate-bounce">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <h1 class="arcade-font text-2xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-2">NEON DASH</h1>
            <p class="text-slate-400 text-sm mb-8">Schiva gli ostacoli ostili e sopravvivi il più a lungo possibile!</p>

            <div class="w-full bg-slate-900/80 rounded-xl p-4 border border-cyan-500/30 mb-8 text-left space-y-2 text-sm text-slate-300">
                <div class="flex items-center space-x-3">
                    <span class="px-2 py-1 bg-cyan-500/20 text-cyan-400 rounded text-xs arcade-font">TOUCH</span>
                    <span>Tocca o trascina a sinistra/destra</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="px-2 py-1 bg-pink-500/20 text-pink-400 rounded text-xs arcade-font">TASTI</span>
                    <span>Freccia Sinistra / Destra</span>
                </div>
            </div>

            <button id="start-btn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-pink-500 rounded-xl font-bold text-lg text-white shadow-lg shadow-cyan-500/30 active:scale-95 transition-all">
                GIOCA ORA
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameover-overlay" class="hidden absolute inset-0 z-20 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
            <h2 class="arcade-font text-3xl text-pink-500 mb-2 drop-shadow-[0_0_10px_rgba(255,0,127,0.8)]">GAME OVER</h2>
            <p class="text-slate-400 text-sm mb-6">Hai distrutto la tua navicella!</p>

            <div class="w-full bg-slate-900/90 rounded-2xl p-6 border border-slate-800 mb-8 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <span class="text-slate-400">Punteggio:</span>
                    <span id="final-score" class="arcade-font text-lg text-cyan-400">0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400">Record Personale:</span>
                    <span id="final-highscore" class="arcade-font text-lg text-pink-400">0</span>
                </div>
            </div>

            <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-pink-500 rounded-xl font-bold text-lg text-white shadow-lg shadow-cyan-500/30 active:scale-95 transition-all flex items-center justify-center space-x-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span>RIPROVA</span>
            </button>
        </div>

        <!-- Mobile Touch Control Zones (Visual Feedback) -->
        <div class="relative z-10 grid grid-cols-2 h-20 w-full pointer-events-none opacity-20">
            <div id="touch-left-indicator" class="bg-cyan-500/20 border-r border-slate-700"></div>
            <div id="touch-right-indicator" class="bg-pink-500/20"></div>
        </div>
    </div>

    <!-- Main Game Logic Script -->
    <script>
        window.onload = function() {
            // Setup Canvas and Context
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('game-container');

            // UI Elements
            const scoreDisplay = document.getElementById('score-display');
            const highscoreDisplay = document.getElementById('highscore-display');
            const finalScore = document.getElementById('final-score');
            const finalHighscore = document.getElementById('final-highscore');
            const startOverlay = document.getElementById('start-overlay');
            const gameoverOverlay = document.getElementById('gameover-overlay');
            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');

            // Responsive Screen Canvas Handling
            let width, height;
            function resizeCanvas() {
                width = container.clientWidth;
                height = container.clientHeight;
                canvas.width = width;
                canvas.height = height;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Game State Variables
            let isPlaying = false;
            let score = 0;
            let highScore = localStorage.getItem('neon_dash_highscore') || 0;
            highscoreDisplay.textContent = Math.floor(highScore);

            let speed = 5;
            let frameCount = 0;
            let obstacles = [];
            let particles = [];
            let stars = [];

            // Initialize Background Starfield
            for (let i = 0; i < 40; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 3 + 1
                });
            }

            // Player Object Definition
            const player = {
                x: width / 2,
                y: height - 120,
                width: 36,
                height: 36,
                targetX: width / 2,
                speed: 12,
                color: '#00f0ff',
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    // Player Ship (Neon Triangle Shape)
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;

                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height / 2);
                    ctx.lineTo(this.width / 2, this.height / 2);
                    ctx.lineTo(-this.width / 2, this.height / 2);
                    ctx.closePath();
                    ctx.fill();

                    // Inner Glow Core
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height / 4);
                    ctx.lineTo(this.width / 4, this.height / 3);
                    ctx.lineTo(-this.width / 4, this.height / 3);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                },
                update() {
                    // Smooth movement interpolation toward touch/key target
                    this.x += (this.targetX - this.x) * 0.25;

                    // Keep inside container boundaries
                    if (this.x < this.width / 2) this.x = this.width / 2;
                    if (this.x > width - this.width / 2) this.x = width - this.width / 2;

                    // Emit thruster particles
                    if (frameCount % 2 === 0) {
                        createParticle(this.x, this.y + this.height / 2, '#00f0ff', 2, (Math.random() - 0.5) * 2, Math.random() * 3 + 2);
                    }
                }
            };

            // Obstacle Generator Class
            class Obstacle {
                constructor() {
                    this.width = Math.random() * (width * 0.35) + 40;
                    this.height = 20;
                    this.x = Math.random() * (width - this.width) + this.width / 2;
                    this.y = -50;
                    this.color = Math.random() > 0.3 ? '#ff007f' : '#ff9900';
                }
                draw() {
                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;
                    ctx.fillStyle = this.color;
                    
                    // Rounded Glowing Box
                    ctx.beginPath();
                    ctx.roundRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height, 8);
                    ctx.fill();

                    // Inner Light Stripe
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x - this.width / 4, this.y - 2, this.width / 2, 4);
                    ctx.restore();
                }
                update() {
                    this.y += speed;
                }
            }

            // Particle Effects Generator
            function createParticle(x, y, color, size, vx, vy) {
                particles.push({
                    x, y, color, size,
                    vx: vx || (Math.random() - 0.5) * 4,
                    vy: vy || (Math.random() - 0.5) * 4,
                    alpha: 1
                });
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.03;

                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.color;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Touch Controls Handler
            function handleTouchMove(e) {
                if (!isPlaying) return;
                const rect = canvas.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                player.targetX = touchX;
            }

            canvas.addEventListener('touchstart', (e) => {
                handleTouchMove(e);
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                handleTouchMove(e);
            }, { passive: true });

            // Keyboard Controls Support
            window.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                const step = width * 0.25;
                if (e.key === 'ArrowLeft' || e.key === 'a') {
                    player.targetX -= step;
                } else if (e.key === 'ArrowRight' || e.key === 'd') {
                    player.targetX += step;
                }
            });

            // Start & Restart Trigger Listeners
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);

            function startGame() {
                isPlaying = true;
                score = 0;
                speed = 5;
                frameCount = 0;
                obstacles = [];
                particles = [];
                player.x = width / 2;
                player.targetX = width / 2;

                startOverlay.classList.add('hidden');
                gameoverOverlay.classList.add('hidden');

                requestAnimationFrame(gameLoop);
            }

            function triggerGameOver() {
                isPlaying = false;

                // Create explosion effect
                for (let i = 0; i < 40; i++) {
                    createParticle(player.x, player.y, '#00f0ff', Math.random() * 4 + 2);
                    createParticle(player.x, player.y, '#ff007f', Math.random() * 4 + 2);
                }

                // Update Highscore
                if (score > highScore) {
                    highScore = Math.floor(score);
                    localStorage.setItem('neon_dash_highscore', highScore);
                    highscoreDisplay.textContent = highScore;
                }

                finalScore.textContent = Math.floor(score);
                finalHighscore.textContent = highScore;

                setTimeout(() => {
                    gameoverOverlay.classList.remove('hidden');
                }, 400);
            }

            // Main Game Loop Function
            function gameLoop() {
                if (!isPlaying) return;

                frameCount++;
                score += 0.1;
                speed += 0.001; // Gradual difficulty scaling

                scoreDisplay.textContent = Math.floor(score);

                // Clear Frame
                ctx.fillStyle = '#0d0e15';
                ctx.fillRect(0, 0, width, height);

                // Draw Moving Stars Background
                ctx.fillStyle = '#ffffff';
                stars.forEach(star => {
                    star.y += star.speed + (speed * 0.2);
                    if (star.y > height) star.y = 0;
                    ctx.globalAlpha = 0.4;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                    ctx.globalAlpha = 1.0;
                });

                // Spawn Obstacles
                const spawnInterval = Math.max(25, Math.floor(60 - speed * 2));
                if (frameCount % spawnInterval === 0) {
                    obstacles.push(new Obstacle());
                }

                // Update & Render Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.update();
                    obs.draw();

                    // Collision Detection (Box vs Triangle bounds)
                    if (
                        player.x + player.width / 2 > obs.x - obs.width / 2 &&
                        player.x - player.width / 2 < obs.x + obs.width / 2 &&
                        player.y + player.height / 2 > obs.y - obs.height / 2 &&
                        player.y - player.height / 2 < obs.y + obs.height / 2
                    ) {
                        triggerGameOver();
                        return;
                    }

                    // Remove off-screen obstacles
                    if (obs.y > height + 50) {
                        obstacles.splice(i, 1);
                    }
                }

                // Update Player and Particles
                player.update();
                player.draw();
                updateParticles();

                requestAnimationFrame(gameLoop);
            }
        };
    </script>
</body>
</html>
